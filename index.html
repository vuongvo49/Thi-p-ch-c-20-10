<title>Chúc 20-10</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500&family=Dancing+Script:wght@600;700&display=swap">
<style>
/* Layout: one centered greeting over a field of drifting hearts; a bouquet of seven hearts sits above the text. Tap anywhere to release more hearts. */
:root {
  --bg: #fff4f7;
  --bg-glow: #ffe0ea;
  --fg: #4a1730;
  --muted: #8a4a66;
  --panel: rgba(255, 255, 255, 0.72);
  --panel-edge: #f6c3d4;
  --h1: #ff3d6e;
  --h2: #ff8a3d;
  --h3: #ffc93d;
  --h4: #3ecf8e;
  --h5: #3da9ff;
  --h6: #8b5cf6;
  --h7: #ff5fc4;
  --font-display: "Dancing Script", "Segoe Script", cursive;
  --font-body: "Be Vietnam Pro", system-ui, -apple-system, "Segoe UI", sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #1d0a16;
    --bg-glow: #3a1230;
    --fg: #ffeef4;
    --muted: #e3a9c0;
    --panel: rgba(46, 16, 38, 0.72);
    --panel-edge: #6b2b52;
    --h1: #ff5c85;
    --h2: #ff9d57;
    --h3: #ffd45c;
    --h4: #4fe0a0;
    --h5: #5cb8ff;
    --h6: #a07cff;
    --h7: #ff7fd0;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #1d0a16;
  --bg-glow: #3a1230;
  --fg: #ffeef4;
  --muted: #e3a9c0;
  --panel: rgba(46, 16, 38, 0.72);
  --panel-edge: #6b2b52;
  --h1: #ff5c85;
  --h2: #ff9d57;
  --h3: #ffd45c;
  --h4: #4fe0a0;
  --h5: #5cb8ff;
  --h6: #a07cff;
  --h7: #ff7fd0;
  color-scheme: dark;
}

html, body { min-height: 100%; }
body {
  background: radial-gradient(ellipse at 50% 20%, var(--bg-glow), var(--bg) 70%) no-repeat, var(--bg);
  background-color: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 32px;
  overflow-x: hidden;
}
#field {
  position: fixed;
  inset: 0;
  width: 100%;
  height: 100%;
  z-index: 0;
  display: block;
}
main {
  position: relative;
  z-index: 1;
  min-height: calc(100vh - 64px);
  display: flex;
  align-items: center;
  justify-content: center;
}
.card {
  width: 100%;
  max-width: 560px;
  min-width: 0;
  background: var(--panel);
  border: 1px solid var(--panel-edge);
  border-radius: 28px;
  padding: 20px 22px 22px;
  text-align: center;
  backdrop-filter: blur(6px);
  -webkit-backdrop-filter: blur(6px);
}

.photo { max-width: 220px; margin: 0 auto 8px; position: relative; }
.photo img { display: block; width: 100%; height: auto; border-radius: 18px; border: 1px solid var(--panel-edge); aspect-ratio: 1 / 1; object-fit: cover; }
.photo .tag { position: absolute; right: -6px; bottom: -14px; width: 44px; height: 40px; filter: drop-shadow(0 3px 6px rgba(0,0,0,0.25)); }
.bouquet { width: min(100%, 150px); height: auto; display: block; margin: 0 auto 2px; overflow: visible; }
.bouquet .h { transform-box: fill-box; transform-origin: 50% 90%; animation: sway 4.5s ease-in-out infinite; }
.bouquet .h:nth-child(2n) { animation-delay: -1.2s; animation-duration: 5.2s; }
.bouquet .h:nth-child(3n) { animation-delay: -2.4s; animation-duration: 3.9s; }
.bouquet .shine { fill: #fff; opacity: 0.45; }
@keyframes sway { 0%, 100% { transform: rotate(-3deg) scale(1); } 50% { transform: rotate(3deg) scale(1.05); } }

.date {
  font-size: 0.8rem;
  letter-spacing: 0.22em;
  text-transform: uppercase;
  color: var(--muted);
  font-weight: 500;
}
h1 {
  font-family: var(--font-display);
  font-weight: 700;
  font-size: clamp(2.4rem, 9vw, 3.8rem);
  line-height: 1.12;
  margin: 4px 0 8px;
  text-wrap: balance;
  background: linear-gradient(90deg, var(--h1), var(--h2), var(--h7), var(--h6), var(--h5));
  -webkit-background-clip: text;
  background-clip: text;
  color: transparent;
  padding-bottom: 0.08em;
}
.wish {
  font-size: 1.02rem;
  line-height: 1.7;
  color: var(--fg);
  max-width: 44ch;
  margin: 0 auto 16px;
  text-wrap: pretty;
}
button.more {
  font: inherit;
  font-weight: 500;
  color: #fff;
  background: linear-gradient(90deg, var(--h1), var(--h7));
  border: 0;
  border-radius: 999px;
  padding: 12px 26px;
  cursor: pointer;
  transition: transform 0.15s ease;
}
button.more:hover { transform: translateY(-2px); }
button.more:active { transform: scale(0.97); }
button.more:focus-visible { outline: 3px solid var(--fg); outline-offset: 3px; }
.hint { margin-top: 10px; font-size: 0.78rem; color: var(--muted); }

@media (prefers-reduced-motion: reduce) {
  .bouquet .h { animation: none; }
  button.more { transition: none; }
}
</style>

      </defs>

<script>
(function () {
  var canvas = document.getElementById("field");
  var ctx = canvas.getContext("2d");
  var reduce = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var tokens = ["--h1", "--h2", "--h3", "--h4", "--h5", "--h6", "--h7"];
  var colors = [];
  var hearts = [];
  var W = 0, H = 0, dpr = 1;
  var heartPath = new Path2D("M16 28C16 28 2 19 2 9.5C2 4.8 5.6 2 9.2 2C12 2 14.6 3.6 16 6C17.4 3.6 20 2 22.8 2C26.4 2 30 4.8 30 9.5C30 19 16 28 16 28Z");

  function readColors() {
    var cs = getComputedStyle(document.documentElement);
    colors = tokens.map(function (t) { return cs.getPropertyValue(t).trim() || "#ff3d6e"; });
    hearts.forEach(function (h) { h.color = colors[h.ci]; });
  }
  function resize() {
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    canvas.width = W * dpr; canvas.height = H * dpr;
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    if (reduce) draw();
  }
  function spawn(x, y, burst) {
    var ci = Math.floor(Math.random() * colors.length);
    var size = 0.5 + Math.random() * 1.1;
    hearts.push({
      x: x, y: y, ci: ci, color: colors[ci], size: size,
      vx: burst ? (Math.random() - 0.5) * 2.4 : (Math.random() - 0.5) * 0.3,
      vy: burst ? -1.2 - Math.random() * 1.8 : -0.25 - Math.random() * 0.55,
      rot: (Math.random() - 0.5) * 0.7, vr: (Math.random() - 0.5) * 0.01,
      phase: Math.random() * 6.28, alpha: 0.35 + Math.random() * 0.5
    });
  }
  function seed() {
    var n = Math.round(Math.min(40, Math.max(18, W / 28)));
    for (var i = 0; i < n; i++) spawn(Math.random() * W, Math.random() * H, false);
  }
  function drawHeart(h) {
    ctx.save();
    ctx.translate(h.x, h.y);
    ctx.rotate(h.rot);
    ctx.scale(h.size, h.size);
    ctx.translate(-16, -14);
    ctx.globalAlpha = h.alpha;
    ctx.fillStyle = h.color;
    ctx.fill(heartPath);
    ctx.restore();
  }
  function draw() {
    ctx.clearRect(0, 0, W, H);
    hearts.forEach(drawHeart);
  }
  function tick(t) {
    for (var i = hearts.length - 1; i >= 0; i--) {
      var h = hearts[i];
      h.x += h.vx + Math.sin(t / 1100 + h.phase) * 0.25;
      h.y += h.vy;
      h.vx *= 0.995;
      h.rot += h.vr;
      if (h.y < -40) {
        if (hearts.length > 70) { hearts.splice(i, 1); }
        else { h.y = H + 30; h.x = Math.random() * W; h.vx = (Math.random() - 0.5) * 0.3; h.vy = -0.25 - Math.random() * 0.55; }
      }
    }
    draw();
    requestAnimationFrame(tick);
  }
  function burstAt(x, y) {
    for (var i = 0; i < 9; i++) spawn(x, y, true);
    if (reduce) draw();
  }

  readColors(); resize(); seed();
  if (reduce) draw(); else requestAnimationFrame(tick);

  window.addEventListener("resize", function () { resize(); });
  window.addEventListener("pointerdown", function (e) {
    if (e.target.id === "more") return;
    burstAt(e.clientX, e.clientY);
  });
  document.getElementById("more").addEventListener("click", function () {
    for (var i = 0; i < 14; i++) spawn(Math.random() * W, H + 10, true);
    if (reduce) draw();
  });
  window.matchMedia("(prefers-color-scheme: dark)").addEventListener("change", function () { setTimeout(readColors, 50); });
  new MutationObserver(function () { setTimeout(readColors, 50); }).observe(document.documentElement, { attributes: true, attributeFilter: ["data-theme"] });
})();
</script>
